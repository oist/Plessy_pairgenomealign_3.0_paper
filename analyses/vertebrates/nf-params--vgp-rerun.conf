// Rerun of the alignment of the human genome to the VGP phase 1 assemblies with
// nf-core/pairgenomealign 3.0.4 and -profile oist.  Use as the only -c file.
//
// Changes from the pipeline defaults, from the trace of the run of
// 10-11 September 2026 (run/execution_trace_2026-09-11_09-44-27.txt):
//
// - ALIGNMENT_LASTAL_M2O used up to 149 GB (gorilla query, 8 threads), and four
//   other tasks between 72 and 96 GB.  The defaults give 72 GB, then 144 GB on
//   the single retry, with the thread count growing at each attempt.  Here the
//   thread count stays at the default 12, and a third attempt is allowed.
// - ALIGNMENT_MERGE used 16 GB and took 2 h with 3 threads; the defaults give
//   12 GB and 4 h with 2 threads.
//
// All other processes stayed below their default allocation.  The one-to-one
// MAF files are published, as in the pipeline defaults.

executor {                      // Slurm throttling, as in the runs of the article
    queueSize       = 200
    pollInterval    = '30s'
    submitRateLimit = '1/10s'
}

process {
    array = 50

    withName: 'ALIGNMENT_LASTAL_M2O' {
        cpus       = 12
        memory     = { [72.GB, 200.GB, 450.GB][task.attempt - 1] }
        maxRetries = 2
    }

    withName: 'ALIGNMENT_MERGE' {
        memory = 32.GB
        time   = 8.h
    }
}
