profiles {
    default {
        executor {
           queueSize = 200
           pollInterval = '30s'
           submitRateLimit = '1/10s'
        }

        process {
            // Slurm starts the elements of an array together, often on the same
            // nodes, and short tasks end together too.  Arrays of 10 limit these
            // bursts (one per 10 s per run, with submitRateLimit) while keeping
            // 10 times fewer submissions than single jobs (2026-11-09).
            array = 10

    //        withName: "SEQTK_CUTN|LAST_DOTPLOT|LAST_MAFCONVERT|MULTIQC" {
    //            resourceLimits = [
    //                memory: 500.GB,
    //                cpus: 40,
    //                time: 2.h
    //            ]
    //            queue          = 'short'
    //            clusterOptions = '-C xeon'
    //        }
            withName: 'ALIGNMENT_SPLIT_O2O' {
                publishDir = [
                    path: { "${params.outdir}/${task.process.tokenize(':')[-1].tokenize('_')[0].toLowerCase()}" },
                    mode: 'copy',
                    saveAs: { filename -> filename.endsWith('.maf.gz') ? null : filename },
                ]
            }
        }
    }

    gbreaks {
        executor {
           queueSize = 400
           pollInterval = '30s'
           submitRateLimit = '1/10s'
        }

        process {
            array = 400
        }
    }

    short {
        process {
            array = 20
            resourceLimits = [
                memory: 500.GB,
                cpus: 40,
                time: 2.h
            ]
            queue          = 'short'
            clusterOptions = '-C xeon --no-requeue'
        }
    }

    cascade {
        process {
            clusterOptions = '-C xeon --no-requeue'
        }
    }

    gbreaksignore {
        process {
            withName:GENOMICBREAKS_STATS {
                errorStrategy='ignore'
            }
        }
    }

    noreverseindexing {
        process {
            withName: 'ALIGNMENT_LASTDB' {
                // Override the -S2 option
                ext.args = { "${params.softmask=="tantan" ? '-R01' : '-R11'} -c -u${params.seed}" }
            }
        }
    }

    local {
        singularity {
            enabled = true
        }

        process {
            resourceLimits = [
                memory: 1.GB,
                cpus: 1,
                time: 1.h
            ]
            executor       = 'local'
            array          = 0       // the local executor does not support job arrays
        }

        params {
            max_memory = 1.GB
            max_cpus   = 1
            max_time   = 1.h
        }
        array = 0
        executor {
           queueSize = 128
        }
    }

    busyLocal {                        // For large runs with more than 200 genomes: export NXF_OPTS='-Xms4g -Xmx16g'
        process {
            resourceLimits = [ memory: '2.5 GB', cpus: 1, time: '1h' ]   // was 1 GB
            executor       = 'local'
            array          = 0
        }
        params {                       // legacy triplet, kept consistent
            max_memory = '2.5 GB'
            max_cpus   = 1
            max_time   = '1h'
        }
        executor {
            queueSize = 150
            cpus      = 150
            memory    = '500 GB'       // stated rather than detected
        }
        timeline {
            enabled = false            // 84 MB for Coleoptera; the trace has the same data
        }
    }

    fungi {
        process {
            queue          = 'short'
            clusterOptions = '-C xeon --no-requeue'
            array          = 200
            resourceLimits = [ memory: 500.GB, cpus: 40, time: 2.h ]
            withName: 'ALIGNMENT_LASTDB'     { cpus = 4 ; memory = {     25.GB     *           task.attempt    } ; maxRetries    = 1  ; time = 2.h                               }
            withName: 'ALIGNMENT_TRAIN'      { cpus = 6 ; memory = { [0,  5.GB, 20.GB,       ][task.attempt]   } ; maxRetries    = 1  ; time = 2.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 6 ; memory = { [0, 10.GB, 25.GB, 200.GB][task.attempt]   } ; maxRetries    = 2  ; time = 2.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_SPLIT_O2O'  { cpus = 1 ; memory = {      5.GB     *           task.attempt    } ; maxRetries    = 1  ; time = 2.h                               }
            withName: 'ALIGNMENT_MERGE'      { cpus = 1 ; memory =       20.GB                                   ; maxRetries    = 1  ; time = 2.h                               }
        }
    }
    
    bzzz {
        process {
            array = 200
            withName: 'ALIGNMENT_LASTDB'     { cpus = 6 ; memory = {     25.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_TRAIN'      { cpus = 6 ; memory = {     10.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 8 ; memory = { [0, 10.GB, 25.GB, 200.GB][task.attempt]   } ; maxRetries    = 3  ; time = 36.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_SPLIT_O2O'  { cpus = 2 ; memory = {     10.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_MERGE'      { cpus = 3 ; memory =       25.GB                                   ; maxRetries    = 1  ; time = 36.h                               }
        }
    }
    
    mammal {
        process {
            withName: 'ALIGNMENT_LASTDB'     { cpus = 6 ; memory = {     25.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_TRAIN'      { cpus = 6 ; memory = {     50.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 8 ; memory = { [0, 50.GB, 100.GB, 500.GB][task.attempt]  } ; maxRetries    = 3  ; time = 36.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_SPLIT_O2O'  { cpus = 2 ; memory = {     25.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_MERGE'      { cpus = 3 ; memory =       25.GB                                   ; maxRetries    = 1  ; time = 36.h                               }
        }
    }
    
    neoteleost {
        process {
            withName: 'ALIGNMENT_LASTDB'     { cpus =  6 ; memory = {     25.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_TRAIN'      { cpus =  6 ; memory = {     15.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus =  8 ; memory = { [0, 20.GB, 50.GB, 200.GB][task.attempt]   } ; maxRetries    = 3  ; time = 36.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_SPLIT_O2O'  { cpus =  2 ; memory = {     15.GB * task.attempt                  } ; maxRetries    = 1  ; time = 36.h                               }
            withName: 'ALIGNMENT_MERGE'      { cpus =  3 ; memory =       25.GB                                   ; maxRetries    = 1  ; time = 36.h                               }
        }
    }
    
    big {
        process {
            withName: 'ALIGNMENT_LASTDB'     { cpus = 12 ; memory = { 200.GB * task.attempt } ; maxRetries    = 1  ; time = 96.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 12 ; memory = { 120.GB * task.attempt } ; maxRetries    = 2  ; time = 96.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_MERGE'      { cpus = 12 ; memory =   300.GB                  ; maxRetries    = 1  ; time = 96.h                               }
        }
    }

    bigger {
        process {
            withName: 'ALIGNMENT_LASTDB'     { cpus = 12 ; memory = { 200.GB * task.attempt } ; maxRetries    = 1  ; time = 96.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 12 ; memory = { 250.GB * task.attempt } ; maxRetries    = 1  ; time = 96.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_MERGE'      { cpus = 12 ; memory =   300.GB                  ; maxRetries    = 1  ; time = 96.h                               }
        }
    }

    biggest {
        process {
            withName: 'ALIGNMENT_LASTDB'     { cpus = 12 ; memory = { 250.GB * task.attempt } ; maxRetries    = 1  ; time = 96.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 12 ; memory = { 500.GB * task.attempt } ; maxRetries    = 1  ; time = 96.h ; errorStrategy = { 'retry' } }
            withName: 'ALIGNMENT_MERGE'      { cpus = 12 ; memory =   300.GB                  ; maxRetries    = 1  ; time = 96.h                               }
        }
    }

    largemem {
        process {
            withName: 'ALIGNMENT_MERGE'      { cpus = 12 ; memory =   300.GB                  ; maxRetries    = 1  ; time = 96.h                               }
            withName: 'ALIGNMENT_LASTDB'     { cpus = 12 ; memory = { 250.GB * task.attempt } ; maxRetries    = 1  ; time = 96.h                               }
            withName: 'ALIGNMENT_LASTAL_M2O' {
                errorStrategy = { 'retry' }
                resourceLimits = [
                    memory: 750.GB,
                    cpus: 30,
                    time: 90.h
                ]
                queue =          { task.attempt > 1 ? 'largemem' : 'compute' }
                clusterOptions = { task.attempt > 1 ?     ''     :'-C zen2'  }
                memory =         { task.attempt > 1 ?   750.GB   :  500.GB   }
                cpus = 12
                maxRetries    = 1
                time = 96.h
            }
        }
    }
}
