// Settings of this Branch, read last by ../scripts/allVersusAll.pl.
//
// The default profile of ../nf-params--profiles.conf does not publish the
// one-to-one MAF files.  The keepmaf profile, given last on the command line
// (--profile large,hybrid_large,keepmaf), publishes them again, as the pipeline
// does by default, so that their sizes can be compared with the CRAM files.
//
// Nextflow merges the publishDir maps of the two profiles key by key, so this
// profile sets every key of the default profile: saveAs keeps every file.  The
// mode is written out: params.publish_dir_mode, defined by the pipeline, is
// null in a file given with -c, and a null mode publishes symbolic links into
// the work directory, which allVersusAll.pl deletes after the copy.  (Tested
// with Nextflow 26.10.6 on 2026-11-15, after the first run of this Branch lost
// its one-to-one files.)
//
// Check before a run, from this directory:
//   nextflow -c ../nf-params--profiles.conf -c ../nf-params--measured.conf \
//       -c nf-params.conf config nf-core/pairgenomealign -r 3.0.4 \
//       -profile oist,default,large,hybrid_large,keepmaf -o flat | grep SPLIT_O2O
// must print mode = 'copy' and saveAs = { filename -> filename }.

profiles {
    keepmaf {
        process {
            withName: 'ALIGNMENT_SPLIT_O2O' {
                publishDir = [
                    path: { "${params.outdir}/alignment" },
                    mode: 'copy',
                    saveAs: { filename -> filename },
                ]
            }
        }
    }
}
