// Generated by deriveProfiles.pl on 2026-11-12 from copies of /bucket/LuscombeU/live/charles-plessy/stl_run_metrics/sample and stl_run_metrics/aves_pilot
// Options: --set-class live/wc/-/Laurasiatheria=laurasiatheria --set-class live/wc/-/VGP=vgp --set-class live/wc/-/Aves=aves
// (versions 3.0,wc,2.3~beta; seeds RY4).  Rules: documentation of deriveProfiles.pl.
// Measurements: measured_resources.tsv; class of each Branch: branch_classes.tsv.
// Use with -profile oist,default,<class>[,local_node] or oist,default,<class>,hybrid_<class>,
// then lastal_largemem for a fourth attempt of LASTAL on largemem; resources and executors only, no ext.args.
profiles {

    small {   // 90th percentile of genome lengths < 1 Gb
        // measured on: Apoidea, Brassicales, Bryopsida, Cephalochordates, Cnidaria, Discoba, Erebia, Fagales, Geometridae, Nematoda, Pyraloidea, Rosales, Tunicates
        // 90 % of the tasks of every per-pair module end within 10 min:
        // suited to a whole node with the local executor (add local_node).
        process {
            withName: 'ALIGNMENT_LASTDB' { cpus = 8 ; memory = { [4.GB, 16.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=72; rss p99 8.9, max 8.9 GB; cpu-min p50 9.41, max 105.05; 90 % within 10 min
            withName: 'ALIGNMENT_TRAIN' { cpus = 8 ; memory = { [24.GB, 48.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=6853; rss p99 23.5, max 24.0 GB; cpu-min p50 0.85, max 54.21; 90 % within 10 min
            withName: 'ALIGNMENT_LASTAL_M2O' { cpus = 8 ; memory = { [32.GB, 128.GB, 480.GB, 750.GB][task.attempt - 1] } ; time = { 4.h * task.attempt } ; maxRetries = 2 ; errorStrategy = { task.exitStatus in ((130..145) + 104 + (175..177) + 1) ? 'retry' : 'finish' } }  // n=6848; rss p99 27.1, max 148.9 GB; cpu-min p50 6.66, max 423.31; 90 % within 10 min
            withName: 'ALIGNMENT_MERGE' { cpus = 2 ; memory = { [8.GB, 16.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=70; rss p99 8.5, max 8.5 GB; cpu-min p50 4.36, max 14.75; 90 % within 10 min
            withName: 'ALIGNMENT_SPLIT_O2O' { cpus = 1 ; memory = { [3.GB, 12.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=6802; rss p99 3.5, max 8.3 GB; cpu-min p50 0.31, max 8.55; 90 % within 10 min
            withName: 'ALIGNMENT_EXP' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=8222; rss p99 0.05, max 0.25 GB; cpu-min p50 0.01, max 2.48; 90 % within 10 min
            withName: 'ALIGNMENT_CRAM' { cpus = 1 ; memory = { [1.GB, 3.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=6698; rss p99 0.94, max 1.6 GB; cpu-min p50 0.17, max 4.0; 90 % within 10 min
            withName: 'ALIGNMENT_DOTPLOT_O2O' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=6662; rss p99 0.97, max 1.1 GB; cpu-min p50 0.07, max 2.19; 90 % within 10 min
            withName: 'ALIGNMENT_DOTPLOT_O2O_FLT' { cpus = 1 ; memory = { [2.GB, 6.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=6634; rss p99 1.8, max 3.3 GB; cpu-min p50 0.08, max 1.81; 90 % within 10 min
            withName: 'CUTN_QUERY' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=2537; rss p99 0.14, max 0.42 GB; cpu-min p50 0.03, max 0.4; 90 % within 10 min
            withName: 'TARGETGENOME_CUTN' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=15; rss p99 0.07, max 0.07 GB; cpu-min p50 0.03, max 0.07; 90 % within 10 min
        }
    }

    hybrid_small {   // after small: -profile oist,default,small,hybrid_small
        // Short modules run in the driver's job (local executor), the others on Slurm.
        // Smallest job: -c 12 --mem=24G; the jobs of allVersusAll.pl (--job-options, default -c 16 --mem=64G) fit.
        // On a login node, from the Branch directory: allVersusAll.pl genomes.csv --profile small,hybrid_small
        // Replay of 68 runs (Apoidea, Brassicales, Bryopsida, Cnidaria, Discoba, Erebia, Fagales, Geometridae, Nematoda, Pyraloidea, Rosales, Tunicates; median 0.4 h each):
        // local work 0.7 core-hours per run (median); end of a run delayed by
        // 0.0 min (median) and 8.4 min (90% of the runs).
        // Short but kept on Slurm: ALIGNMENT_TRAIN (critical path).
        process {
            withName: 'ALIGNMENT_EXP|ALIGNMENT_CRAM|ALIGNMENT_DOTPLOT_O2O|ALIGNMENT_DOTPLOT_O2O_FLT|CUTN_QUERY|SAMTOOLS_FAIDX|SAMTOOLS_DICT|HTSLIB_BGZIPTABIX|MULTIQC|TARGETGENOME_CUTN' {
                executor = 'local'
                array    = 0            // the local executor does not support job arrays
            }
            // One memory value: the local executor only counts it; 99th percentile of peak RSS x 1.2,
            // or the largest minus the reserve of the job.
            withName: 'ALIGNMENT_EXP' { cpus = 1 ; memory = 1.GB }
            withName: 'ALIGNMENT_CRAM' { cpus = 1 ; memory = 2.GB }
            withName: 'ALIGNMENT_DOTPLOT_O2O' { cpus = 1 ; memory = 2.GB }
            withName: 'ALIGNMENT_DOTPLOT_O2O_FLT' { cpus = 1 ; memory = 3.GB }
            withName: 'CUTN_QUERY' { cpus = 1 ; memory = 1.GB }
            withName: 'SAMTOOLS_FAIDX' { cpus = 1 ; memory = 1.GB }
            withName: 'SAMTOOLS_DICT' { cpus = 1 ; memory = 1.GB }
            withName: 'HTSLIB_BGZIPTABIX' { cpus = 1 ; memory = 1.GB }
            withName: 'MULTIQC' { cpus = 1 ; memory = 2.GB }
            withName: 'TARGETGENOME_CUTN' { cpus = 1 ; memory = 1.GB }
        }
        executor {
            // The local executor only: STL_LOCAL_CPUS and STL_LOCAL_MEM_MB, set by
            // allVersusAll.pl, or else the job's cores and memory minus 2 cores and 8 GB.
            // In the executor scope itself, cpus and memory would also bound the Slurm
            // executor (Nextflow 26.10), and the throttles of the default profile would
            // hold back local tasks.  The v2 config parser warns 'Unrecognized config
            // option' about $local but applies it (Nextflow 26.04 and 26.10).
            $local {
                cpus            = (System.getenv('STL_LOCAL_CPUS') ?: Math.max(1, (System.getenv('SLURM_CPUS_PER_TASK') ?: '4') as int - 2)) as int
                memory          = "${System.getenv('STL_LOCAL_MEM_MB') ?: Math.max(1024, (System.getenv('SLURM_MEM_PER_NODE') ?: '16384') as long - 8192)} MB"
                submitRateLimit = '1000/1s'
                pollInterval    = '1s'
            }
        }
    }

