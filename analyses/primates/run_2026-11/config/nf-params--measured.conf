        // On a login node, from the Branch directory: allVersusAll.pl genomes.csv --profile xlarge,hybrid_xlarge
        // Replay of 3 runs (Polyneoptera; median 36.9 h each):
        // local work 0.8 core-hours per run (median); end of a run delayed by
        // 3.8 min (median) and 4.5 min (90% of the runs).
        // Short but kept on Slurm: none.
        process {
            withName: 'ALIGNMENT_EXP|ALIGNMENT_CRAM|ALIGNMENT_DOTPLOT_O2O|ALIGNMENT_DOTPLOT_O2O_FLT|CUTN_QUERY|SAMTOOLS_FAIDX|SAMTOOLS_DICT|HTSLIB_BGZIPTABIX|MULTIQC|TARGETGENOME_CUTN' {
                executor = 'local'
                array    = 0            // the local executor does not support job arrays
            }
            // One memory value: the local executor only counts it; 99th percentile of peak RSS x 1.2,
            // or the largest minus the reserve of the job.
            withName: 'ALIGNMENT_EXP' { cpus = 1 ; memory = 1.GB }
            withName: 'ALIGNMENT_CRAM' { cpus = 1 ; memory = 3.GB }
            withName: 'ALIGNMENT_DOTPLOT_O2O' { cpus = 1 ; memory = 3.GB }
            withName: 'ALIGNMENT_DOTPLOT_O2O_FLT' { cpus = 1 ; memory = 6.GB }
            withName: 'CUTN_QUERY' { cpus = 1 ; memory = 3.GB }
            withName: 'SAMTOOLS_FAIDX' { cpus = 1 ; memory = 1.GB }
            withName: 'SAMTOOLS_DICT' { cpus = 1 ; memory = 1.GB }
            withName: 'HTSLIB_BGZIPTABIX' { cpus = 1 ; memory = 1.GB }
            withName: 'MULTIQC' { cpus = 1 ; memory = 2.GB }
            withName: 'TARGETGENOME_CUTN' { cpus = 1 ; memory = 1.GB }
        }
        executor {
            // The local executor only: STL_LOCAL_CPUS and STL_LOCAL_MEM_MB, set by
            // allVersusAll.pl, or else the job's cores and memory minus 2 cores and 8 GB.
            // In the executor scope itself, cpus and memory would also bound the Slurm
            // executor (Nextflow 26.10), and the throttles of the default profile would
            // hold back local tasks.  The v2 config parser warns 'Unrecognized config
            // option' about $local but applies it (Nextflow 26.04 and 26.10).
            $local {
                cpus            = (System.getenv('STL_LOCAL_CPUS') ?: Math.max(1, (System.getenv('SLURM_CPUS_PER_TASK') ?: '4') as int - 2)) as int
                memory          = "${System.getenv('STL_LOCAL_MEM_MB') ?: Math.max(1024, (System.getenv('SLURM_MEM_PER_NODE') ?: '16384') as long - 8192)} MB"
                submitRateLimit = '1000/1s'
                pollInterval    = '1s'
            }
        }
    }

    aves {   // class given by hand (--set-class)
        // measured on: Aves
        // Not all per-pair modules are short: see hybrid_aves.
        process {
            withName: 'ALIGNMENT_LASTDB' { cpus = 8 ; memory = { [8.GB, 16.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=16; rss p99 5.4, max 5.4 GB; cpu-min p50 24.53, max 29.76; 90 % within 10 min
