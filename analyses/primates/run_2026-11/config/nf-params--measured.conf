    lastal_largemem {   // last: -profile oist,default,<class>[,hybrid_<class>],lastal_largemem
        // A fourth attempt on the largemem partition (768 GB nodes, access on application), with the
        // fourth memory value of the class profile (750 GB).  Its nodes are Intel ones, which -C zen2
        // of the oist profile excludes, and the 500 GB cap of that profile is raised for these modules only.
        process {
            withName: 'ALIGNMENT_LASTAL_M2O' { maxRetries = 3 ; queue = { task.attempt > 3 ? 'largemem' : 'compute' } ; clusterOptions = { task.attempt > 3 ? '' : '-C zen2' } ; resourceLimits = [ memory: 750.GB, cpus: 30, time: 90.h ] }
        }
    }
