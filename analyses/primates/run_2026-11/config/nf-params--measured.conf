            withName: 'ALIGNMENT_MERGE' { cpus = 4 ; memory = { [24.GB, 48.GB, 480.GB][task.attempt - 1] } ; time = { 8.h * task.attempt } ; maxRetries = 2 }  // n=14; rss p99 20.0, max 20.0 GB; cpu-min p50 234.95, max 279.68
            withName: 'ALIGNMENT_SPLIT_O2O' { cpus = 1 ; memory = { [12.GB, 24.GB, 480.GB][task.attempt - 1] } ; time = { 2.h * task.attempt } ; maxRetries = 2 }  // n=6048; rss p99 7.6, max 8.2 GB; cpu-min p50 7.74, max 13.67
            withName: 'ALIGNMENT_EXP' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=11835; rss p99 0.05, max 0.48 GB; cpu-min p50 1.96, max 6.67; 90 % within 10 min
            withName: 'ALIGNMENT_CRAM' { cpus = 1 ; memory = { [2.GB, 4.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=5829; rss p99 1.4, max 1.5 GB; cpu-min p50 4.49, max 6.6; 90 % within 10 min
            withName: 'ALIGNMENT_DOTPLOT_O2O' { cpus = 1 ; memory = { [4.GB, 8.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=5842; rss p99 2.7, max 2.8 GB; cpu-min p50 1.5, max 2.34; 90 % within 10 min
            withName: 'ALIGNMENT_DOTPLOT_O2O_FLT' { cpus = 1 ; memory = { [8.GB, 16.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=5960; rss p99 4.9, max 5.2 GB; cpu-min p50 1.67, max 2.75; 90 % within 10 min
            withName: 'CUTN_QUERY' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=6239; rss p99 0.22, max 0.25 GB; cpu-min p50 0.11, max 0.17; 90 % within 10 min
            withName: 'TARGETGENOME_CUTN' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=16; rss p99 0.22, max 0.22 GB; cpu-min p50 0.11, max 0.14; 90 % within 10 min
        }
