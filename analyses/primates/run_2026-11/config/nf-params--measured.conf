            withName: 'CUTN_QUERY' { cpus = 1 ; memory = { [1.GB, 2.GB, 480.GB][task.attempt - 1] } ; time = { 1.h * task.attempt } ; maxRetries = 2 }  // n=12489; rss p99 0.37, max 0.52 GB; cpu-min p50 0.07, max 0.55; 90 % within 10 min
